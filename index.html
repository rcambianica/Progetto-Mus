<!DOCTYPE html>
<html lang="en">
<html>

<head>
    <meta charset="UTF-8">
    <title>Homepage progetto</title>
    <link rel="stylesheet" href="css/app.css">
</head>

<body>
    <header class="app-header">
        <h1>Web Processing for Sound and Music Project</h1>
    </header>

    <main class="app-layout">

        <section class="panel">
            <h2>Audio Context</h2>

            <button id="initAudioContextBtn">
                Initialize Audio Context
            </button>

            <p>
                Status:
                <span id="audioContextStatus">not initialized</span>
            </p>

            <p>
                Sample rate:
                <span id="audioContextSampleRate">-</span>
            </p>
        </section>

        <section class="panel">
            <h2>Audio Input</h2>

            <label for="audioFileInput">
                Upload audio file
            </label>

            <input type="file" id="audioFileInput" accept="audio/wav,audio/mpeg,audio/ogg,audio/*">

            <p>
                File:
                <span id="originalFileName">-</span>
            </p>

            <p>
                Duration:
                <span id="originalDuration">-</span>
            </p>

            <p>
                Sample rate:
                <span id="originalSampleRate">-</span>
            </p>

            <p>
                Channels:
                <span id="originalChannels">-</span>
            </p>

            <p>
                Peak:
                <span id="originalPeak">-</span>
            </p>

            <p>
                Peak dBFS:
                <span id="originalPeakDb">-</span>
            </p>
        </section>

        <section class="panel waveform-panel">
            <h2>Original Waveform</h2>

            <canvas id="originalWaveformCanvas"></canvas>
        </section>

    </main>

    <script type="module" src="js/app.js"></script>
</body>

</html>
